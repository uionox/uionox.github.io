<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — UIONOX</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; overflow: auto; }
  .win { width: 340px; max-width: calc(100vw - 32px); background: #ece9d8; border: 1px solid #0a3aa8; border-radius: 6px; box-shadow: 2px 3px 14px rgba(0,0,0,.4); font-family: Tahoma, Verdana, Geneva, sans-serif; }
  .bar { background: linear-gradient(90deg,#0a3aa8,#3a7fe0); color: #fff; font-size: 12px; font-weight: bold; padding: 5px 8px; border-radius: 5px 5px 0 0; }
  .body { padding: 18px 20px 20px; display: flex; gap: 14px; align-items: flex-start; }
  .icon { width: 32px; height: 32px; flex: none; border-radius: 50%; background: radial-gradient(circle at 35% 30%,#ff6a4a,#c22 70%); color: #fff; font-size: 20px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
  .msg { font-size: 12px; color: #222; line-height: 1.5; }
  .msg b { display: block; font-size: 13px; margin-bottom: 4px; }
  .actions { display: flex; justify-content: flex-end; padding: 0 20px 16px; }
  .actions a { font-size: 11.5px; color: #000; text-decoration: none; background: linear-gradient(180deg,#fff,#e2e8f5); border: 1px solid #7089c0; border-radius: 3px; padding: 4px 16px; }
  .actions a:hover { background: linear-gradient(180deg,#fff,#cfd8ee); }
</style>
</head>
<body>
<div class="win">
  <div class="bar">System Error</div>
  <div class="body">
    <div class="icon">!</div>
    <div class="msg"><b>Error 404: Window not found</b>This page doesn't exist, or was moved.</div>
  </div>
  <div class="actions"><a href="/">OK</a></div>
</div>
</body>
</html>
