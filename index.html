<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hussein Moussa - UIONOX</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#fff;
    font-family:Inter,sans-serif;
    overflow:hidden;
    user-select:none;
}

/* Animated background */

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 20% 30%, rgba(70,70,70,.18), transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(120,120,120,.12), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.04), transparent 60%);
    filter:blur(30px);
    animation:move 12s ease-in-out infinite alternate;
}

@keyframes move{
    from{
        transform:scale(1) rotate(0deg);
    }
    to{
        transform:scale(1.2) rotate(8deg);
    }
}

.hero{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.brand{
    font-size:1rem;
    letter-spacing:.7rem;
    opacity:.7;
    margin-bottom:25px;
}

h1{
    font-family:Anton,sans-serif;
    font-size:clamp(5rem,16vw,13rem);
    line-height:.9;
    letter-spacing:.08em;
    text-transform:uppercase;
    text-shadow:0 0 30px rgba(255,255,255,.08);
}

.subtitle{
    margin-top:30px;
    font-size:1rem;
    letter-spacing:.35rem;
    opacity:.6;
}

.grid{
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
    background-size:80px 80px;
    mask-image:radial-gradient(circle, black 40%, transparent 90%);
    pointer-events:none;
}

.glow{
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.08), transparent 70%);
    filter:blur(60px);
    z-index:-1;
}
</style>
</head>
<body>

<div class="grid"></div>

<section class="hero">

    <div class="glow"></div>

    <div class="brand">UIONOX</div>

    <h1>COMING<br>SOON</h1>

    <div class="subtitle">
        Creating what deserves to exist
    </div>

</section>

</body>
</html>
